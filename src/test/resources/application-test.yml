server:
  forward-headers-strategy: none

spring:
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: ap-northeast-2
  datasource:
    driver-class-name: org.h2.Driver
    password:
    url: jdbc:h2:mem:gdgoc-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
  flyway:
    enabled: false
  jackson:
    time-zone: Asia/Seoul
  jpa:
    database: h2
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
        show_sql: false
        time_zone: Asia/Seoul
    show-sql: false
  mail:
    host: localhost
    password: test
    port: 2525
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
    username: test
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  s3:
    bucket: test-bucket
  recruit:
    core:
      # 컨텍스트 기동용 고정값. 기간 동작은 RecruitCoreApplicationServiceTest 가
      # 자기 상수로 검증하므로 여기 값이 무엇인지는 중요하지 않다.
      open-at: 2026-08-10T00:00:00+09:00
      close-at: 2026-08-30T23:59:59+09:00
    member:
      # 같은 이유의 고정값. 기간 동작은 RecruitMemberPeriodServiceTest 가 자기 상수로 검증한다.
      open-at: 2026-08-17T00:00:00+09:00
      close-at: 2026-09-09T23:59:59+09:00

google:
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-uri: http://localhost/redirect

jwt:
  googleIssuer: test-google-issuer
  secretKey: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  selfIssuer: test-self-issuer

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.type: warn
