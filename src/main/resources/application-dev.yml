server:
  forward-headers-strategy: framework

spring:
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION}
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
  flyway:
    baseline-on-migrate: true
    clean-disabled: true
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    ignore-migration-patterns: "*:missing,*:future"
  jackson:
    time-zone: Asia/Seoul
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
    show-sql: false
  mail:
    host: smtp.gmail.com
    password: ${GMAIL_PASSWORD}
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    username: ${GMAIL}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  web:
    resources:
      add-mappings: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  s3:
    bucket: ${AWS_TEST_RESOURCE_BUCKET}
  admin:
    login-id: ${ADMIN_LOGIN_ID}
    password: ${ADMIN_LOGIN_PASSWORD}
  mail:
    recruit-from: ${APP_MAIL_RECRUIT_FROM:}
  recruit:
    core:
      # 모집 기간. 코드가 아니라 여기서 바꾼다 — 2차 모집은 환경변수만 고치면 된다.
      # KST 오프셋을 그대로 쓴다 (OffsetDateTime.parse 로 읽는다).
      open-at: ${RECRUIT_CORE_OPEN_AT:2026-08-10T00:00:00+09:00}
      close-at: ${RECRUIT_CORE_CLOSE_AT:2026-08-30T23:59:59+09:00}
    member:
      # 부원 모집 기간. 코어와 같은 방식으로 서버가 판정한다 — 전에는 기간 개념이 없어
      # 오픈 전에도 지원이 됐다. 웹의 src/constant/recruitSchedule.ts 와 값을 맞춘다.
      open-at: ${RECRUIT_MEMBER_OPEN_AT:2026-08-17T00:00:00+09:00}
      close-at: ${RECRUIT_MEMBER_CLOSE_AT:2026-09-09T23:59:59+09:00}

google:
  client-id: ${GOOGLE_CLIENT_ID}

jwt:
  googleIssuer: ${GOOGLE_ISSUER}
  secretKey: ${SECRET_KEY}
  selfIssuer: ${SELF_ISSUER}
  audience: ${JWT_AUDIENCE}
  accessTokenValidity: ${JWT_ACCESS_TOKEN_VALIDITY:3600000}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: off
