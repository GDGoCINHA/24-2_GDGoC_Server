server:
  forward-headers-strategy: framework

spring:
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION}
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    username: ${DB_USERNAME}
  flyway:
    baseline-description: "Baseline existing schema"
    baseline-on-migrate: true
    baseline-version: 1
    enabled: true
    locations: classpath:db/migration
    schemas: public
    ignore-migration-patterns: "*:missing,*:future"
  jackson:
    time-zone: Asia/Seoul
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
  mail:
    host: smtp.gmail.com
    password: ${GMAIL_PASSWORD}
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    username: ${GMAIL}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  web:
    resources:
      add-mappings: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  # 비워두면 기동할 때마다 임의 키를 만든다. 60초짜리 QR 토큰이라 재시작으로 무효가 돼도
  # 화면을 새로고침하면 그만이다. 다만 서버를 여러 대로 늘리면 반드시 채워야 한다.
  event-checkin:
    secret: ${EVENT_CHECKIN_SECRET:}
  s3:
    bucket: ${AWS_TEST_RESOURCE_BUCKET}
  admin:
    login-id: ${ADMIN_LOGIN_ID}
    password: ${ADMIN_LOGIN_PASSWORD}
  mail:
    recruit-from: ${APP_MAIL_RECRUIT_FROM:}
  recruit:
    core:
      # 모집 기간. 코드가 아니라 여기서 바꾼다 — 2차 모집은 환경변수만 고치면 된다.
      # KST 오프셋을 그대로 쓴다 (OffsetDateTime.parse 로 읽는다).
      open-at: ${RECRUIT_CORE_OPEN_AT:2026-08-10T00:00:00+09:00}
      close-at: ${RECRUIT_CORE_CLOSE_AT:2026-09-08T23:59:59+09:00}
    member:
      # 부원 모집 기간. 코어와 같은 방식으로 서버가 판정한다 — 전에는 기간 개념이 없어
      # 오픈 전에도 지원이 됐다.
      #
      # 부원은 코어와 달리 **상시 모집**이다. 그래서 close-at 은 2026-2 학기가 끝나는 날까지
      # 열어 둔다. 웹이 카드에 보여주는 '집중 모집 기간'(8/17 ~ 9/9)은 이 값이 아니라
      # 웹 상수 src/constant/recruitSchedule.ts 의 MEMBER_SCHEDULE 이 출처다 — 표시 전용이며
      # 게이팅과 무관하다. 일정이 바뀌면 그쪽도 함께 고친다.
      #
      # 2027-02-01 을 넘기면 SemesterCalculator 가 Y27_1 을 돌려주므로, 이번 학기 지원서를
      # 한 학기로 모으려면 1월 말이 마지노선이다.
      open-at: ${RECRUIT_MEMBER_OPEN_AT:2026-08-17T00:00:00+09:00}
      close-at: ${RECRUIT_MEMBER_CLOSE_AT:2027-01-31T23:59:59+09:00}

google:
  client-id: ${GOOGLE_CLIENT_ID}

jwt:
  googleIssuer: ${GOOGLE_ISSUER}
  secretKey: ${SECRET_KEY}
  selfIssuer: ${SELF_ISSUER}
  audience: ${JWT_AUDIENCE}
  accessTokenValidity: ${JWT_ACCESS_TOKEN_VALIDITY:3600000}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace
