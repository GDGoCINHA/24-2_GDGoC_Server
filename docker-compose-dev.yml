version: "3.8"

services:
  app:
    image: "${DOCKER_HUB_USERNAME}/gdgoc-be-app-dev:latest"
    container_name: gdgoc-be-app-dev
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME_DEV}"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - /home/ubuntu/gdgoc-be-app-dev/.env:/app/.env
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: gdgoc-redis-dev
    restart: always
    # 로그인 토큰이 여기 있다. 배포 스크립트가 `down` 으로 컨테이너를 지우므로 데이터를 이름 있는 볼륨에 둔다.
    # 볼륨이 없으면 배포할 때마다 모든 사용자가 로그아웃된다.
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    env_file:
      - .env

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:v5.4.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9999:8080
    environment:
      DOZZLE_USERNAME: "${DOZZLE_USERNAME}"
      DOZZLE_PASSWORD: "${DOZZLE_PASSWORD}"
    restart: always
    env_file:
      - .env

volumes:
  redis-data:
